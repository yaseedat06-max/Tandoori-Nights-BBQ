<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandoori Nights BBQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; text-align: center; }
        header { background-color: #1e1e1e; padding: 40px 20px; border-bottom: 3px solid #ff4500; }
        h1 { color: #ff4500; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #cccccc; font-size: 1.1rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .menu-section { margin-top: 30px; }
        .menu-title { font-size: 1.8rem; color: #ff4500; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .menu-item { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-weight: bold; font-size: 1.1rem; }
        .item-price { color: #ff4500; font-weight: bold; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background-color: #ff4500; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; }
        footer { margin-top: 40px; padding: 20px; color: #777; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>Tandoori Nights BBQ</h1>
        <p>Authentic Charcoal Grilled Flavors & Specialty Dishes</p>
    </header>

    <div class="container">
        <div class="menu-section">
            <h2 class="menu-title">Popular Menu Items</h2>
            
            <div class="menu-item">
                <span class="item-name">Chicken Tandoori Platter</span>
                <span class="item-price">Featured</span>
            </div>

            <div class="menu-item">
                <span class="item-name">Seekh Kebab Special</span>
                <span class="item-price">Featured</span>
            </div>

            <div class="menu-item">
                <span class="item-name">BBQ Mix Grill</span>
                <span class="item-price">Featured</span>
            </div>
        </div>

        <a href="tel:0000000000" class="btn">Call Us to Order</a>
    </div>

    <footer>
        <p>&copy; 2026 Tandoori Nights BBQ. All rights reserved.</p>
    </footer>

</body>
</html>
